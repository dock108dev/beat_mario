id: world_8_big_tanks
game: smb3
goal_type: product_goal
execution_status: executable
user_directive: From a fresh game, complete the accepted double-whistle route, enter World 8 Big Tanks by normal map input, clear it through normal gameplay, and stop on the stable post-clear World 8 map.
display:
  name: World 8 Big Tanks
  subtitle: World 2-first double-whistle route through World 8 Big Tanks

objective:
  type: route_completion
  target: world_8_big_tanks_post_clear

runner:
  backend: fceux
  preset: fceux_world_8_big_tanks
  script: scripts/fceux_1_1_agent.lua
  artifacts_root: artifacts/goals/world_8_big_tanks
  require_perfect: true
  executable: true

route:
  catalog: data/segments/world_8_double_whistle.yaml
  prefix_goal: world_8_double_whistle
  segments:
    - id: world_8_big_tanks_clear
      classification: objective_milestone
      execution_mode: normal_gameplay
      evidence: [bounded_live_fceux_2026-08-10_normal_entry_and_clear]

bridged_segments: []

constraints:
  prefer_real_gameplay: true
  allow_bridge_steps: false
  preserve_attempt_artifacts: true
  explain_failures: true
  start_from_power_on: true
  stop_before_next_world_8_segment: true

allowed_tactics:
  scripted_inputs: true
  memory_observation: true
  known_transition_bridge: false
  blind_state_mutation: false

success_metrics:
  - id: accepted_world_8_prefix
    type: event_present
    value: post_probe_world_8_map_arrival
  - id: exact_big_tanks_entry
    type: event_present
    value: post_probe_world_8_big_tanks_entered
  - id: normal_big_tanks_gameplay
    type: event_present
    value: post_probe_world_8_big_tanks_gameplay
  - id: game_enforced_big_tanks_clear
    type: event_present
    value: post_probe_world_8_big_tanks_clear
  - id: stable_post_clear_boundary
    type: final_event
    value: post_probe_world_8_big_tanks_post_clear
  - id: accepted_observer_trace
    type: summary_field
    field: post_probe_clear
    equals: true

recovery_policy:
  wrong_map:
    action: stop_and_review
  wrong_stage:
    action: stop_and_review
  wrong_entry_state:
    action: stop_and_review
  death:
    action: stop_and_review
  gameplay_stall:
    action: stop_and_review
  timeout:
    action: stop_and_review
  false_clear:
    action: stop_and_review
  missing_post_clear:
    action: stop_and_review
  unexpected_next_stage:
    action: stop_and_review
  ambiguous_state:
    action: capture_artifacts_and_stop
