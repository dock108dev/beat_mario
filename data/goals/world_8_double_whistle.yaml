id: world_8_double_whistle
game: smb3
goal_type: product_goal
execution_status: executable
user_directive: From a fresh game, collect both World 1 Warp Whistles, safely reach World 2, use both whistles, and arrive on the World 8 map.
display:
  name: World 8 Arrival
  subtitle: World 2-first double-whistle route to World 8

objective:
  type: route_completion
  target: world_8_map_arrival

runner:
  backend: fceux
  preset: fceux_world_8_double_whistle
  script: scripts/fceux_1_1_agent.lua
  artifacts_root: artifacts/goals/world_8_double_whistle
  require_perfect: true
  executable: true

route:
  catalog: data/segments/world_8_double_whistle.yaml
  segments:
    - id: fresh_start_to_1_1
      classification: game_prerequisite
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_fresh_route]
    - id: world_1_1_clear
      classification: game_prerequisite
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_fresh_route]
    - id: world_1_2_clear
      classification: game_prerequisite
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_fresh_route]
    - id: world_1_3_whistle
      classification: objective_milestone
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_first_whistle_inventory]
    - id: world_1_fortress_whistle
      classification: objective_milestone
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_two_whistle_inventory]
    - id: world_1_5_water_path
      classification: game_prerequisite
      execution_mode: normal_gameplay
      evidence: [owner_corrected_world_2_boundary, live_fceux_2026-08-09_world_1_5_clear]
    - id: world_1_6_clear
      classification: game_prerequisite
      execution_mode: normal_gameplay
      evidence: [owner_corrected_world_2_boundary, live_fceux_2026-08-09_1_6_fresh_playback]
    - id: world_1_airship_to_king
      classification: game_prerequisite
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_world_8_fresh_playback_x3]
    - id: world_2_map_arrival_with_two_whistles
      classification: objective_milestone
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_world_8_fresh_playback_x3]
    - id: world_2_first_whistle_use
      classification: objective_milestone
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_world_8_fresh_playback_x3]
    - id: warp_zone_5_6_7_tier
      classification: objective_milestone
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_world_8_fresh_playback_x3]
    - id: warp_zone_second_whistle_use
      classification: objective_milestone
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_world_8_fresh_playback_x3]
    - id: warp_zone_world_8_tier
      classification: objective_milestone
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_world_8_fresh_playback_x3]
    - id: world_8_pipe_entry
      classification: objective_milestone
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_world_8_fresh_playback_x3]
    - id: world_8_map_arrival
      classification: objective_milestone
      execution_mode: normal_gameplay
      evidence: [live_fceux_2026-08-09_world_8_fresh_playback_x3]

bridged_segments: []

constraints:
  prefer_real_gameplay: true
  allow_bridge_steps: false
  preserve_attempt_artifacts: true
  explain_failures: true
  preserve_two_whistles_until_world_2: true
  do_not_enter_numbered_warp_zone_pipe_before_second_whistle: true

allowed_tactics:
  scripted_inputs: true
  memory_observation: true
  known_transition_bridge: false
  blind_state_mutation: false

success_metrics:
  - id: first_world_1_whistle_collected
    type: event_present
    value: post_probe_1_3_whistle_room_success
  - id: second_world_1_whistle_collected
    type: event_present
    value: post_probe_1_fortress_whistle_room_success
  - id: world_2_arrival_with_two_whistles
    type: event_present
    value: post_probe_world_2_map_two_whistles
  - id: first_whistle_used_from_world_2
    type: event_present
    value: post_probe_world_2_first_whistle_used
  - id: second_whistle_used_from_warp_zone
    type: event_present
    value: post_probe_warp_zone_second_whistle_used
  - id: reaches_world_8_map
    type: final_event
    value: post_probe_world_8_map_arrival
  - id: accepted_observer_trace
    type: summary_field
    field: post_probe_clear
    equals: true

recovery_policy:
  life_lost:
    action: reclassify_state
    continue_if_contract_allows: true
  wrong_map_node:
    action: correct_known_state_or_stop
  timeout:
    action: stop_and_review
  unknown_state:
    action: capture_artifacts_and_stop
